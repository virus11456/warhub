name: Update data

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name  "warhub-bot"
          git config user.email "bot@warhub.local"
          git add data/
          git diff --staged --quiet && { echo "no data changes"; exit 0; }
          git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%MZ')"
          # 併發推送競態：另一個 run 先推了會被 rejected → rebase 後重試，避免整批資料遺失
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)…"
            git pull --rebase --autostash origin main || true
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push still failing after retries"; exit 1
