name: Update data

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:
    inputs:
      test_push:
        description: '傳一則測試推播到 Telegram/Discord（驗證連線）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 公開頻道（選填；未設定則預設 @warhubss、範圍 all）
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_SCOPE: ${{ vars.TELEGRAM_CHANNEL_SCOPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          # 選填：到 Settings → Secrets and variables → Actions → Variables 設定可調整推播行為
          DIGEST_EVERY_HOURS: ${{ vars.DIGEST_EVERY_HOURS }}
          ALERT_ESCALATION: ${{ vars.ALERT_ESCALATION }}
          ALERT_PIZZA: ${{ vars.ALERT_PIZZA }}
          ALERT_HOTSPOT: ${{ vars.ALERT_HOTSPOT }}
          HOTSPOT_SURGE_RATIO: ${{ vars.HOTSPOT_SURGE_RATIO }}
          HOTSPOT_SURGE_MIN: ${{ vars.HOTSPOT_SURGE_MIN }}
        run: python scripts/fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name  "warhub-bot"
          git config user.email "bot@warhub.local"
          # data 皆為整份重算 → 併發競態時「我們的最新資料直接勝出」，不做 rebase/merge
          # （避免兩個 run 同時重算 data.json 造成 merge conflict 卡死）
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main      # HEAD 移到遠端最新，工作區的新資料保留
            git add data/
            if git diff --staged --quiet; then echo "no data changes"; exit 0; fi
            git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected by concurrent run, re-syncing (attempt $i)…"
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push still failing after retries"; exit 1
