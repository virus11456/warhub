name: Update data

on:
  schedule:
    - cron: '23 * * * *'  # 每小時檢查；110 分鐘守門員限制實際抓取，避免延遲後再多等兩小時
  workflow_dispatch:
    inputs:
      collection_mode:
        description: 'auto：快資料每輪、慢資料6小時、歷史24小時；fast：只更新快資料；full：完整流程'
        type: choice
        options: [auto, fast, full]
        default: auto
      force_refresh:
        description: '略過近期更新檢查，強制收集一次（可能觸發正常通知）'
        type: boolean
        default: false
      quiet:
        description: '靜默資料更新（不發送任何通知；供備援與驗證）'
        type: boolean
        default: false
      notify_only:
        description: '只檢查並發送未通知的新鮮正常摘要；不抓資料，quiet仍優先'
        type: boolean
        default: false
      test_push:
        description: '傳一則測試推播到 Telegram/Discord（驗證連線）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the latest branch after acquiring the workflow concurrency slot.
          ref: ${{ github.ref }}

      - name: Check collection spacing
        id: spacing
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          TEST_PUSH: ${{ inputs.test_push }}
          NOTIFY_ONLY: ${{ inputs.notify_only }}
          QUIET: ${{ inputs.quiet }}
        run: python3 scripts/collection_guard.py

      - uses: actions/setup-python@v5
        if: steps.spacing.outputs.collect == 'true' || steps.spacing.outputs.notify_saved == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        if: steps.spacing.outputs.collect == 'true' || steps.spacing.outputs.notify_saved == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        if: steps.spacing.outputs.collect == 'true'
        env:
          WARHUB_NO_NOTIFY: ${{ inputs.quiet && '1' || '0' }}
          WARHUB_TRANSLATION_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TRANSLATION_MODEL: ${{ vars.GROQ_TRANSLATION_MODEL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 公開頻道（選填；未設定則預設 @warhubss、範圍 all）
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_SCOPE: ${{ vars.TELEGRAM_CHANNEL_SCOPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          WARHUB_SOURCE_ARCHIVE_DIR: /tmp/warhub-source-archive
          NOTAC_API_KEY: ${{ secrets.NOTAC_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
          # 選填：FRED 免費 API key（設定後啟用 EM／高收益信用利差封存）
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WARHUB_COLLECTION_MODE: ${{ inputs.collection_mode || 'auto' }}
          TEST_PUSH: ${{ inputs.test_push }}
          # 選填：到 Settings → Secrets and variables → Actions → Variables 設定可調整推播行為
          DIGEST_EVERY_HOURS: ${{ vars.DIGEST_EVERY_HOURS }}
          ALERT_ESCALATION: ${{ vars.ALERT_ESCALATION }}
          ALERT_PIZZA: ${{ vars.ALERT_PIZZA }}
          ALERT_HOTSPOT: ${{ vars.ALERT_HOTSPOT }}
          HOTSPOT_SURGE_RATIO: ${{ vars.HOTSPOT_SURGE_RATIO }}
          HOTSPOT_SURGE_MIN: ${{ vars.HOTSPOT_SURGE_MIN }}
        run: python scripts/fetch_data.py

      - name: Sample and preserve GDELT events at most every six hours
        if: steps.spacing.outputs.collect == 'true' && inputs.collection_mode != 'fast'
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/collect_gdelt_events.py --output /tmp/warhub-source-archive

      - name: Preserve source observations if later steps fail
        if: always() && steps.spacing.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: source-observations
          path: /tmp/warhub-source-archive/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit data.json
        if: steps.spacing.outputs.collect == 'true'
        run: |
          # 注意：commit author email 必須是有效的 GitHub 帳號 email，否則
          # Vercel（Hobby 方案）會以「commit author email is not valid」擋掉
          # 該次自動部署（狀態 BLOCKED），導致網站停在舊快照不更新。
          git config user.name  "warhub-bot"
          git config user.email "localhost20000@gmail.com"
          # data 皆為整份重算 → 併發競態時「我們的最新資料直接勝出」，不做 rebase/merge
          # （避免兩個 run 同時重算 data.json 造成 merge conflict 卡死）
          # Save exactly what the collector produced, before merge guards alter the live view.
          # Keep the new immutable archive outside the checkout across push retries.
          python scripts/archive_snapshot.py --output /tmp/warhub-new-archive
          if [ -d /tmp/warhub-source-archive ]; then
            cp -rn /tmp/warhub-source-archive/. /tmp/warhub-new-archive/
          fi
          for i in 1 2 3 4 5; do
            git fetch origin main
            # 只提交 data/：先把這次算好的 data/ 暫存，工作區「完全對齊」遠端最新
            # （含所有已合併的 PR），再放回我們的 data/。這樣這次 commit 只會動到
            # data/，永遠不會用舊 checkout 的工作區把別人剛合併的檔案（文章、程式）
            # 回捲——修正先前 git reset --soft + git add data/ 會連帶提交過時樹的問題。
            rm -rf /tmp/newdata && cp -r data /tmp/newdata
            git reset --hard origin/main
            rm -rf data && cp -r /tmp/newdata data
            # 防覆蓋守門員：把遠端已累積的歷史聯集回工作區，避免舊 checkout 的 run
            # 把較完整的累積歷史（如回填的共軍架次舊日期）蓋掉。
            # A failed history guard must stop publication, not silently bypass preservation.
            python scripts/merge_history.py
            mkdir -p archives
            cp -rn /tmp/warhub-new-archive/. archives/
            git add -A data/ archives/
            if git diff --staged --quiet; then echo "no data changes"; exit 0; fi
            git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected by concurrent run, re-syncing (attempt $i)…"
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push still failing after retries"; exit 1

      - name: Preserve analysis snapshots even if submission fails
        if: always() && steps.spacing.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-snapshots
          path: /tmp/warhub-new-archive/
          if-no-files-found: ignore
          retention-days: 30


      - name: Notify fresh saved snapshot when collection is skipped
        if: steps.spacing.outputs.notify_saved == 'true'
        env:
          WARHUB_NOTIFY_ONLY: ${{ inputs.notify_only }}
          WARHUB_NO_NOTIFY: ${{ inputs.quiet && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_SCOPE: ${{ vars.TELEGRAM_CHANNEL_SCOPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIGEST_EVERY_HOURS: ${{ vars.DIGEST_EVERY_HOURS }}
        run: python scripts/notify_snapshot.py prepare --state /tmp/warhub-notify-state.json

      - name: Commit notification receipts only
        if: steps.spacing.outputs.notify_saved == 'true'
        run: |
          if [ ! -f /tmp/warhub-notify-state.json ]; then exit 0; fi
          git config user.name "warhub-bot"
          git config user.email "localhost20000@gmail.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # apply verifies observation content and previous receipts before writing _notify only.
            python scripts/notify_snapshot.py apply --state /tmp/warhub-notify-state.json
            git add data/data.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "data: save notification receipts"
            if git push origin HEAD:main; then exit 0; fi
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "notification receipt publication failed"; exit 1

      - name: Preserve notification receipts even if submission fails
        if: always() && steps.spacing.outputs.notify_saved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notification-receipts
          path: /tmp/warhub-notify-state.json
          if-no-files-found: ignore
          retention-days: 30


      - name: Explain notification status (read only)
        if: always()
        env:
          WARHUB_NO_NOTIFY: ${{ inputs.quiet && '1' || '0' }}
          DIGEST_EVERY_HOURS: ${{ vars.DIGEST_EVERY_HOURS }}
        run: python3 scripts/notification_status.py --data data/data.json
