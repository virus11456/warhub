name: Translate saved titles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Translate existing snapshot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TRANSLATION_MODEL: ${{ vars.GROQ_TRANSLATION_MODEL }}
          WARHUB_NO_NOTIFY: '1'
        run: python scripts/refresh_translations.py
      - name: Save translated titles
        run: |
          git config user.name 'warhub-bot'
          git config user.email 'localhost20000@gmail.com'
          git add data/data.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data: translate saved titles with Groq'
          # A concurrent external update rejects this push; never force or overwrite it.
          git push origin HEAD:main
