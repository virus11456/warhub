name: Translate saved titles
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-warhub-bilingual-ui
  cancel-in-progress: false
jobs:
  translate:
    if: github.ref == 'refs/heads/codex/bilingual-insights'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Prepare public UI and guide translations only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TRANSLATION_MODEL: ${{ vars.GROQ_TRANSLATION_MODEL }}
        run: python scripts/translate_ui.py
      - name: Preserve completed catalogue on this work branch
        if: always()
        run: |
          if [ ! -f locales/en.json ]; then exit 0; fi
          git config user.name 'warhub-bot'
          git config user.email 'localhost20000@gmail.com'
          git add locales/en.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Prepare English UI and guide catalogue'
          git push origin HEAD:refs/heads/codex/bilingual-insights
