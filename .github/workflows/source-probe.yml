name: Probe upstream sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Probe without writes or notifications
        env:
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WARHUB_NO_NOTIFY: '1'
        run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: probe-report.json
          retention-days: 7
