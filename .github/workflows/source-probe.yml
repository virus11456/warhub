name: Probe upstream sources
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'comtrade：單筆查詢；gdelt_events：一批事件與提及；all：完整來源探測'
        type: choice
        options: [comtrade, gdelt_events, all]
        default: comtrade
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify production Comtrade collector
        if: inputs.source == 'comtrade'
        env:
          WARHUB_SOURCE_ARCHIVE_DIR: /tmp/warhub-source-archive
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          WARHUB_NO_NOTIFY: '1'
        run: python scripts/probe_comtrade.py
      - name: Probe without writes or notifications
        if: inputs.source == 'all'
        env:
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WARHUB_NO_NOTIFY: '1'
        run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        if: inputs.source == 'all'
        with:
          name: source-probe
          path: probe-report.json
          retention-days: 7
      - name: Preserve Comtrade probe observations
        if: always() && inputs.source == 'comtrade'
        uses: actions/upload-artifact@v4
        with:
          name: comtrade-observations
          path: /tmp/warhub-source-archive/
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify one GDELT event batch
        if: inputs.source == 'gdelt_events'
        run: python scripts/probe_gdelt_events.py --output /tmp/warhub-gdelt-events
      - name: Preserve GDELT batch and report
        if: always() && inputs.source == 'gdelt_events'
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-event-batch
          path: /tmp/warhub-gdelt-events/
          if-no-files-found: ignore
          retention-days: 30
