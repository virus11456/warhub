name: BestTime setup

# 手動執行：替披薩店與酒吧建立 BestTime 預測（每店成功 2 credits、失敗 1 credit）。
# 排程更新從不呼叫；須在 confirm 輸入 SPEND 才會扣點。結果寫入 data/besttime_venues.json。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all：披薩＋酒吧；pizza：只建披薩店；bars：只建酒吧'
        type: choice
        options: [all, pizza, bars]
        default: all
      redo:
        description: '已建檔的店也重建（重新扣點，更新平常人流）'
        type: boolean
        default: false
      confirm:
        description: '輸入 SPEND 才會實際扣 BestTime credits；其他值只列出店家與最多花費'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Create forecasts
        id: forecast
        env:
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          SCOPE: ${{ inputs.scope }}
          REDO: ${{ inputs.redo }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          args="--scope $SCOPE"
          [ "$REDO" = "true" ] && args="$args --all"
          [ "$CONFIRM" = "SPEND" ] || args="$args --dry-run"
          cd scripts && python besttime_setup.py $args

      - name: Commit venues
        if: always() && inputs.confirm == 'SPEND'
        run: |
          git config user.name  "warhub-bot"
          git config user.email "localhost20000@gmail.com"
          git add data/besttime_venues.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: BestTime venue forecasts"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
