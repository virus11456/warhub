name: Validate isolated data snapshot
on:
  workflow_dispatch:
  push:
    branches: ['codex/data-integrity-audit']
    paths: ['scripts/validate_snapshot.py', '.github/workflows/snapshot-validation.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Validate current sources using isolated files
        env:
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WARHUB_NO_NOTIFY: '1'
        run: python scripts/validate_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-snapshot
          path: |
            snapshot-report.json
            validated-snapshot.json
            validated-data/
          retention-days: 7

  preview_snapshot:
    needs: snapshot
    if: github.ref == 'refs/heads/codex/data-integrity-audit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/data-integrity-audit
      - uses: actions/download-artifact@v4
        with:
          name: isolated-snapshot
          path: snapshot-artifact
      - name: Publish validated files to the preview branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/data-integrity-audit
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source=Path('snapshot-artifact/validated-data')
          data=json.loads((source/'data.json').read_text())
          assert data['score']['model_version']=='wpi-4.0'
          assert data['score']['is_probability'] is False
          assert '_notify' not in data
          for name in ['data.json','history.json','food_history.json','strat_history.json','pla_adiz.json','metrics_daily.json']:
              assert (source/name).is_file()
              shutil.copyfile(source/name,Path('data')/name)
          PY
          git config user.name warhub-bot
          git config user.email localhost20000@gmail.com
          git add data/data.json data/history.json data/food_history.json data/strat_history.json data/pla_adiz.json data/metrics_daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: validated preview snapshot (notifications disabled)"
          git push origin HEAD:refs/heads/codex/data-integrity-audit
